<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>PowerNotes</title>
  <meta name="description" content="A fun, clean place to organize class notes.">
  <meta name="theme-color" content="#FFF8E7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16161F" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="PowerNotes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400;0,600;0,700;0,800;0,900;1,400;1,700&display=swap">
  <link rel="stylesheet" href="css/styles.css">
  <style>:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); } [hidden] { display: none !important; }</style>
</head>
<body>
<div class="app" id="app" data-pane="list">
  <div class="side-scrim" id="sideScrim"></div>
  <nav class="col sidebar" id="sidebar" aria-label="Subjects"></nav>
  <section class="col list-col" id="listCol" aria-label="Notes"></section>
  <main class="col editor-col pop" id="editorCol" aria-label="Editor"></main>
</div>
<script src="js/app.js"></script>
</body>
</html>
